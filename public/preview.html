<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#FFFFFF">
  <title>校园集 · 二手好物</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #20342c;
      --muted: #78857d;
      --green: #2f7658;
      --green-dark: #235d45;
      --paper: #fffefa;
      --line: #e9ece4;
      --canvas: #f7f8f2;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--canvas);
      color: var(--ink);
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
    }

    .page {
      width: 100%;
      padding: 0 24px;
      margin: 0 auto;
    }

    header {
      height: 76px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #e8ebe3;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0;
      border: 0;
      background: transparent;
      color: inherit;
      font-size: 19px;
      font-weight: 750;
      letter-spacing: -0.5px;
      cursor: pointer;
    }

    .brand-mark {
      display: grid;
      width: 35px;
      height: 35px;
      place-items: center;
      border-radius: 12px;
      background: #e4f0e5;
      font-size: 19px;
    }

    .action-button {
      display: inline-flex;
      min-height: 40px;
      align-items: center;
      justify-content: center;
      padding: 0 15px;
      border: 1px solid var(--green);
      border-radius: 999px;
      background: var(--green);
      color: white;
      font: inherit;
      font-size: 13px;
      font-weight: 650;
      cursor: pointer;
      transition: background 160ms ease, transform 160ms ease;
    }

    .action-button:hover {
      transform: translateY(-1px);
      background: var(--green-dark);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    #language-select {
      min-height: 40px;
      padding: 0 27px 0 10px;
      border: 1px solid #e1e7de;
      border-radius: 999px;
      background: var(--paper);
      color: #53645a;
      font: inherit;
      font-size: 12px;
      cursor: pointer;
    }

    .message-entry {
      position: relative;
      min-height: 40px;
      padding: 0 14px;
      border: 1px solid #e1e7de;
      border-radius: 999px;
      background: var(--paper);
      color: #53645a;
      font: inherit;
      font-size: 13px;
      font-weight: 650;
      cursor: pointer;
    }

    .unread-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      flex: 0 0 8px;
      border-radius: 50%;
      background: #d94b47;
    }

    .unread-dot[hidden] { display: none; }

    .message-entry .unread-dot {
      position: absolute;
      top: 5px;
      right: 7px;
    }

    main { padding: 25px 0 48px; }

    .view[hidden] { display: none; }

    .eyebrow {
      margin: 0 0 5px;
      color: var(--green);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1.4px;
    }

    h1 {
      margin: 0;
      font-size: clamp(26px, 4vw, 32px);
      letter-spacing: -1.2px;
      line-height: 1.2;
    }

    #market-view { padding-top: 0; }

    .search-wrap {
      position: relative;
      margin-bottom: 0;
    }

    .search-icon {
      position: absolute;
      top: 50%;
      left: 18px;
      color: #88948b;
      font-size: 17px;
      transform: translateY(-50%);
      pointer-events: none;
    }

    #search {
      width: 100%;
      height: 48px;
      padding: 0 18px 0 48px;
      border: 1px solid #e4e8df;
      border-radius: 15px;
      outline: none;
      background: var(--paper);
      color: var(--ink);
      font: inherit;
      font-size: 14px;
      box-shadow: 0 5px 18px rgb(42 63 48 / 3%);
      transition: border-color 160ms ease, box-shadow 160ms ease;
    }

    #search:focus {
      border-color: #83ad91;
      box-shadow: 0 0 0 4px rgb(47 118 88 / 10%);
    }

    .list-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 17px 0 11px;
    }

    .list-heading h2 {
      margin: 0;
      font-size: 16px;
      font-weight: 700;
    }

    #result-count {
      color: var(--muted);
      font-size: 13px;
    }

    .items {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 18px;
    }

    .item-card {
      display: flex;
      min-width: 0;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--paper);
      box-shadow: 0 8px 25px rgb(36 57 42 / 4%);
      transition: transform 160ms ease, box-shadow 160ms ease;
      cursor: pointer;
    }

    .item-card[hidden] { display: none; }

    .item-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 30px rgb(36 57 42 / 8%);
    }

    .item-card-link:focus-visible,
    .showcase-link:focus-visible {
      outline: 3px solid rgb(47 118 88 / 35%);
      outline-offset: 3px;
    }

    .item-cover {
      position: relative;
      display: grid;
      width: 100%;
      aspect-ratio: 16 / 10;
      place-items: center;
      overflow: hidden;
      background: #edf1e9;
    }

    .item-cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .image-placeholder {
      display: grid;
      width: 100%;
      height: 100%;
      min-height: 120px;
      place-content: center;
      justify-items: center;
      gap: 7px;
      background: linear-gradient(145deg, #f1f3eb, #e8eee6);
      color: #78877b;
      font-size: 12px;
    }

    .placeholder-icon {
      color: #97a69a;
      font-size: 26px;
      line-height: 1;
    }

    .item-content {
      display: flex;
      min-width: 0;
      flex-direction: column;
      padding: 13px 15px 15px;
    }

    .category {
      align-self: flex-start;
      padding: 5px 9px;
      border-radius: 999px;
      background: #edf4ed;
      color: var(--green);
      font-size: 11px;
      font-weight: 650;
    }

    .item-content h3 {
      margin: 10px 0 8px;
      overflow: hidden;
      font-size: 16px;
      letter-spacing: -0.3px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .item-bottom {
      display: flex;
      width: 100%;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-top: 2px;
    }

    .price {
      color: var(--green-dark);
      font-size: 20px;
      font-weight: 750;
      white-space: nowrap;
    }

    .price small {
      margin-right: 1px;
      font-size: 13px;
    }

    .location {
      color: #879188;
      font-size: 11px;
      text-align: right;
      white-space: nowrap;
    }

    .condition-label {
      display: inline-flex;
      align-items: center;
      padding: 5px 8px;
      border-radius: 999px;
      background: #f1f3ed;
      color: #68766d;
      font-size: 11px;
      white-space: nowrap;
    }

    .category-filters {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      margin-bottom: 12px;
      padding: 2px 0 4px;
      scrollbar-width: thin;
    }

    .category-chip {
      flex: 0 0 auto;
      min-height: 32px;
      padding: 0 13px;
      border: 1px solid #e1e7de;
      border-radius: 999px;
      background: var(--paper);
      color: #69766d;
      font: inherit;
      font-size: 12px;
      cursor: pointer;
    }

    .category-chip[aria-pressed="true"] {
      border-color: var(--green);
      background: var(--green);
      color: #fff;
    }

    #empty-state {
      padding: 42px 20px;
      border: 1px dashed #dce3d8;
      border-radius: 16px;
      color: var(--muted);
      text-align: center;
    }

    #empty-state[hidden] { display: none; }

    .detail-topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }

    .text-button {
      padding: 7px 0;
      border: 0;
      background: transparent;
      color: var(--green-dark);
      font: inherit;
      font-size: 13px;
      font-weight: 650;
      cursor: pointer;
    }

    .detail-layout {
      display: grid;
      grid-template-columns: minmax(0, 1.05fr) minmax(300px, .95fr);
      align-items: start;
      gap: 36px;
    }

    .detail-gallery { min-width: 0; }

    .detail-main-image {
      display: grid;
      width: 100%;
      aspect-ratio: 4 / 3;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: #edf1e9;
    }

    .detail-main-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .detail-main-image .image-placeholder { min-height: 240px; }

    .thumbnails {
      display: flex;
      gap: 10px;
      margin-top: 12px;
      overflow-x: auto;
    }

    .thumbnail {
      width: 76px;
      height: 60px;
      flex: 0 0 auto;
      overflow: hidden;
      padding: 0;
      border: 2px solid transparent;
      border-radius: 9px;
      background: #edf1e9;
      cursor: pointer;
    }

    .thumbnail[aria-pressed="true"] { border-color: var(--green); }

    .thumbnail img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .detail-copy { padding: 8px 0; }

    .detail-copy h1 {
      margin: 12px 0 14px;
      font-size: clamp(26px, 3.5vw, 34px);
    }

    .detail-price {
      margin: 0 0 18px;
      color: var(--green-dark);
      font-size: 29px;
      font-weight: 750;
    }

    .detail-price-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .like-button {
      display: inline-flex;
      min-width: 46px;
      min-height: 34px;
      align-items: center;
      justify-content: center;
      gap: 5px;
      padding: 5px 9px;
      border: 1px solid #e3e9ed;
      border-radius: 999px;
      background: rgb(255 255 255 / 94%);
      color: #53636c;
      font: inherit;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    .heart-icon { color: #77868e; font-size: 18px; line-height: 1; }
    .like-button[aria-pressed="true"] .heart-icon { color: #d94b55; }
    .like-button:hover { border-color: #e7aab0; }

    .detail-facts {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin: 0 0 22px;
      padding: 16px;
      border-radius: 14px;
      background: #f1f4ec;
    }

    .detail-fact dt {
      margin-bottom: 5px;
      color: var(--muted);
      font-size: 11px;
    }

    .detail-fact dd {
      margin: 0;
      font-size: 13px;
      font-weight: 650;
    }

    .detail-section-title {
      margin: 20px 0 8px;
      font-size: 14px;
    }

    .detail-description {
      margin: 0;
      color: #66746b;
      font-size: 14px;
      line-height: 1.8;
      white-space: pre-wrap;
    }

    .contact-button {
      width: 100%;
      min-height: 48px;
      margin-top: 24px;
      border-radius: 12px;
      font-size: 14px;
    }

    .dialog-backdrop[hidden] { display: none; }

    .dialog-backdrop {
      position: fixed;
      z-index: 10;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 18px;
      background: rgb(26 39 31 / 48%);
    }

    .chat-dialog {
      display: flex;
      width: min(100%, 430px);
      max-height: min(640px, 90vh);
      flex-direction: column;
      overflow: hidden;
      border-radius: 18px;
      background: var(--paper);
      box-shadow: 0 20px 70px rgb(0 0 0 / 20%);
    }

    .chat-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 18px;
      border-bottom: 1px solid var(--line);
    }

    .chat-header h2 {
      margin: 0;
      font-size: 16px;
    }

    .chat-header p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 11px;
    }

    .close-button {
      width: 34px;
      height: 34px;
      border: 0;
      border-radius: 50%;
      background: #f0f3ed;
      color: #53645a;
      font-size: 20px;
      cursor: pointer;
    }

    .chat-notice {
      margin: 12px 14px 0;
      padding: 9px 11px;
      border-radius: 9px;
      background: #f1f4ec;
      color: #69766d;
      font-size: 11px;
      line-height: 1.5;
    }

    .chat-messages {
      display: flex;
      min-height: 170px;
      flex: 1;
      flex-direction: column;
      gap: 9px;
      overflow-y: auto;
      padding: 14px;
    }

    .chat-message {
      max-width: 82%;
      align-self: flex-start;
      padding: 9px 12px;
      border-radius: 13px 13px 13px 3px;
      background: #eff2eb;
      color: var(--ink);
      font-size: 13px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .chat-message.mine {
      align-self: flex-end;
      border-radius: 13px 13px 3px 13px;
      background: #e2efe4;
    }

    .chat-composer {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      padding: 12px 14px 14px;
      border-top: 1px solid var(--line);
    }

    .chat-composer input {
      min-width: 0;
      height: 40px;
      padding: 0 12px;
      border: 1px solid #e1e7de;
      border-radius: 10px;
      outline: none;
      font: inherit;
      font-size: 13px;
    }

    .chat-composer .action-button { min-height: 40px; }

    .offer-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      padding: 0 14px 13px;
    }

    .offer-row input {
      min-width: 0;
      height: 40px;
      padding: 0 12px;
      border: 1px solid #e1e7de;
      border-radius: 10px;
      font: inherit;
      font-size: 13px;
    }

    .offer-row .secondary-button { min-height: 40px; }

    .inbox-dialog {
      width: min(100%, 460px);
      max-height: min(640px, 90vh);
    }

    .conversation-list {
      display: grid;
      gap: 8px;
      overflow-y: auto;
      padding: 12px;
    }

    .conversation-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 12px;
      padding: 13px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--paper);
      color: inherit;
      text-align: left;
      cursor: pointer;
    }

    .conversation-row:hover { background: #f5f7f1; }

    .conversation-title {
      display: block;
      margin-bottom: 4px;
      font-size: 13px;
      font-weight: 700;
    }

    .conversation-preview {
      display: block;
      overflow: hidden;
      color: var(--muted);
      font-size: 12px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .conversation-seller {
      display: block;
      margin-top: 5px;
      color: #89948c;
      font-size: 11px;
    }

    .conversation-row > .unread-dot { margin: 0 3px; }

    .form-panel {
      width: 100%;
      max-width: 680px;
      margin-inline: auto;
      box-sizing: border-box;
      padding: 28px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--paper);
      box-shadow: 0 8px 25px rgb(36 57 42 / 4%);
    }

    .form-heading { margin-bottom: 24px; }

    .form-heading h1 {
      font-size: clamp(26px, 4vw, 34px);
      letter-spacing: -1px;
    }

    .form-heading p {
      margin: 9px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .publish-form {
      display: grid;
      gap: 18px;
    }

    .field {
      display: grid;
      gap: 8px;
    }

    .field label {
      font-size: 13px;
      font-weight: 650;
    }

    .field label span {
      margin-left: 5px;
      color: #879188;
      font-size: 11px;
      font-weight: 400;
    }

    .field input,
    .field textarea,
    .field select {
      width: 100%;
      min-height: 46px;
      padding: 11px 13px;
      border: 1px solid #e4e8df;
      border-radius: 11px;
      outline: none;
      background: var(--paper);
      color: var(--ink);
      font: inherit;
      font-size: 14px;
    }

    .field textarea {
      min-height: 180px;
      resize: vertical;
    }

    .field input:focus,
    .field textarea:focus,
    .field select:focus {
      border-color: #83ad91;
      box-shadow: 0 0 0 4px rgb(47 118 88 / 10%);
    }

    .form-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 10px;
      margin-top: 6px;
    }

    .secondary-button {
      min-height: 42px;
      padding: 0 16px;
      border: 1px solid #dfe5dc;
      border-radius: 999px;
      background: transparent;
      color: #53645a;
      font: inherit;
      font-size: 13px;
      cursor: pointer;
    }

    .secondary-button:hover { background: #f3f5ef; }

    .form-actions .action-button { min-height: 42px; }

    footer {
      padding: 18px 0 28px;
      color: #98a198;
      font-size: 12px;
      text-align: center;
    }

    @media (max-width: 820px) {
      .items { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .detail-layout { grid-template-columns: minmax(0, 1fr) minmax(260px, .9fr); gap: 24px; }
    }

    @media (max-width: 440px) {
      header {
        height: auto;
        min-height: 66px;
        flex-wrap: wrap;
        gap: 8px;
        padding: 8px 0;
      }
      main { padding-top: 18px; }
      .brand { gap: 7px; font-size: 17px; }
      .brand-mark { width: 32px; height: 32px; }
      .action-button { min-height: 37px; padding: 0 12px; font-size: 12px; }
      .header-actions { gap: 4px; }
      #language-select { width: 84px; min-height: 37px; padding: 0 18px 0 8px; font-size: 11px; }
      .message-entry { min-height: 37px; padding: 0 10px; font-size: 12px; }
      #publish-view { width: calc(100% + 16px); margin-inline: -8px; }
      #publish-view .form-panel { padding: 20px 16px; }
      .items { grid-template-columns: 1fr 1fr; gap: 10px; }
      .item-content { padding: 10px; }
      .item-content h3 { font-size: 14px; }
      .price { font-size: 18px; }
      .condition-label { padding: 4px 6px; font-size: 10px; }
      .detail-layout { grid-template-columns: 1fr; gap: 18px; }
      .detail-main-image .image-placeholder { min-height: 180px; }
      .detail-copy { padding: 0; }
      .detail-topline { margin-bottom: 12px; }
    }
  </style>
  <style>
    :root {
      --ink: #18232c;
      --muted: #64727c;
      --green: #23845b;
      --green-dark: #176844;
      --paper: #fff;
      --line: #dce3e8;
      --canvas: #f6f8fa;
      --blue: #006b9f;
      --blue-dark: #005880;
    }

    * { box-sizing: border-box; }
    body {
      background: var(--canvas);
      color: var(--ink);
      font-family: "Segoe UI", "Microsoft YaHei", "微軟正黑體", sans-serif;
    }
    button, input, select, textarea { font: inherit; }
    .page { width: 100%; max-width: none; padding-inline: 24px; }
    header {
      min-height: 68px;
      padding-block: 10px;
      border-bottom: 1px solid var(--line);
    }
    .brand { color: var(--ink); font-size: 20px; }
    .brand-mark { display: none; }
    .header-actions { gap: 12px; }
    .language-label { color: var(--muted); font-size: 13px; }
    #language-select {
      min-height: 38px;
      padding: 0 28px 0 10px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background-color: #fff;
      color: var(--ink);
      font-size: 13px;
    }
    .nav-button, .action-button, .secondary-button, .text-button {
      border-radius: 6px;
      box-shadow: none;
    }
    .nav-button {
      min-height: 38px;
      padding: 0 10px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--ink);
      cursor: pointer;
    }
    .nav-button:hover { border-color: var(--line); background: #fff; }
    .action-button {
      min-height: 40px;
      padding: 0 16px;
      border: 1px solid var(--blue);
      background: var(--blue);
      color: #fff;
      font-size: 14px;
      font-weight: 600;
    }
    .action-button:hover { background: var(--blue-dark); border-color: var(--blue-dark); }
    .secondary-button {
      min-height: 40px;
      padding: 0 14px;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
    }
    .secondary-button:hover { border-color: var(--blue); color: var(--blue); }
    main { padding-block: 20px 36px; }
    .search-wrap {
      width: 100%;
      max-width: none;
      min-height: 48px;
      margin: 0 0 16px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: #fff;
      box-shadow: none;
    }
    .search-wrap input { color: var(--ink); }
    .campus-banner {
      display: grid;
      min-height: 112px;
      margin: 0 0 20px;
      place-items: center;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: #fff;
    }
    .campus-banner img {
      display: block;
      width: min(100%, 360px);

<body>
  <div class="page">
    <header>
      <nav class="header-navigation" aria-label="主导航" data-i18n-aria-label="nav.main">
        <button class="brand" id="home-button" type="button" aria-label="返回逛市集" data-i18n-aria-label="nav.home">
          <span class="brand-title">HKMU MARKET</span>
          <span class="brand-tagline" data-i18n="brand.tagline">让闲置，在校园流动</span>
        </button>
        <button class="nav-button" id="open-marketplace" type="button" data-i18n="nav.market">首页</button>
        <button class="nav-button message-entry" id="open-inbox" type="button" aria-label="消息">
          <span id="message-entry-label" data-i18n="nav.messages">消息</span>
          <span class="unread-dot" id="header-unread-dot" aria-label="有未读消息"></span>
        </button>
        <button class="nav-button" id="open-my-listings" type="button" data-i18n="nav.myListings">我的发布</button>
      </nav>
      <div class="header-actions">
        <label class="language-label" for="language-select" data-i18n="language.label">语言</label>
        <select id="language-select" aria-label="选择语言" data-i18n-aria-label="language.label">
          <option value="zh-CN">简体中文</option>
          <option value="zh-TW">繁體中文</option>
          <option value="en">English</option>
        </select>
        <button class="action-button" id="open-publish" type="button"><span aria-hidden="true">＋ </span><span data-i18n="nav.publish">发布物品</span></button>
      </div>
    </header>

    <main>
      <section class="view" id="market-view" aria-label="逛市集" data-i18n-aria-label="market.aria">
        <div class="market-layout">
          <form class="search-wrap home-search" id="search-form">
            <span class="search-icon" aria-hidden="true">⌕</span>
            <label for="search" class="visually-hidden" data-i18n="search.label">搜索二手物品</label>
            <input id="search" type="search" data-i18n-placeholder="search.placeholder" placeholder="搜一搜书籍、数码、生活好物..." autocomplete="off">
            <button class="action-button search-submit" type="submit" data-i18n="search.submit">搜索</button>
          </form>
          <nav class="popular-searches" aria-label="热门搜索" data-i18n-aria-label="search.popular">
            <span class="popular-search-label" data-i18n="search.popular">热门搜索</span>
            <div class="popular-search-list">
              <button class="popular-search" type="button" data-i18n="search.termHeadphones">耳机</button>
              <button class="popular-search" type="button" data-i18n="search.termBooks">教材</button>
              <button class="popular-search" type="button" data-i18n="search.termMath">高等数学</button>
            </div>
          </nav>
          <section class="showcase-section" aria-labelledby="showcase-title">
            <div class="showcase-heading">
              <h2 id="showcase-title" data-i18n="market.featured">校园精选</h2>
              <p data-i18n="market.featuredHint">按点赞热度推荐</p>
            </div>
            <div class="showcase-grid" id="showcase-grid" role="region" aria-label="精选展示" data-i18n-aria-label="showcase.aria"></div>
          </section>
          <div class="category-filters" id="category-filters" role="group" aria-label="商品分类" data-i18n-aria-label="category.group">
            <button class="category-chip" type="button" data-category="" aria-pressed="true"><span data-i18n="category.all">全部</span></button>
            <button class="category-chip" type="button" data-category="书籍教材" aria-pressed="false"><span data-i18n="category.books">书籍教材</span></button>
            <button class="category-chip" type="button" data-category="数码配件" aria-pressed="false"><span data-i18n="category.tech">数码配件</span></button>
            <button class="category-chip" type="button" data-category="生活用品" aria-pressed="false"><span data-i18n="category.home">生活用品</span></button>
            <button class="category-chip" type="button" data-category="运动户外" aria-pressed="false"><span data-i18n="category.sports">运动户外</span></button>
            <button class="category-chip" type="button" data-category="其他好物" aria-pressed="false"><span data-i18n="category.other">其他好物</span></button>
          </div>
          <section aria-labelledby="list-title">
            <div class="list-heading">
              <h2 id="list-title" data-i18n="market.latest">刚刚上架</h2>
              <span id="result-count" aria-live="polite">2 件好物</span>
            </div>
            <div class="items" id="items"></div>
            <div id="empty-state" role="status" hidden data-i18n="search.empty">没有找到相关好物，试试其他关键词吧。</div>
          </section>
        </div>
      </section>

      <section class="view" id="publish-view" aria-label="发布物品" data-i18n-aria-label="nav.publish" hidden>
        <div class="form-panel">
          <div class="form-heading">
            <button class="text-button messages-back" id="publish-back" type="button" data-i18n="message.back">← 返回上一页</button>
            <p class="eyebrow" data-i18n="form.eyebrow">SHARE A GOOD FIND</p>
            <h1 id="form-title" data-i18n="form.title">发布一件好物</h1>
            <p data-i18n="form.intro">填写物品信息，预览后即可在市集列表中查看。</p>
          </div>
          <form class="publish-form" id="publish-form" novalidate>
            <div class="field field-title">
              <label for="title"><span data-i18n="form.name">名称</span><span data-i18n="form.required">必填</span></label>
              <input id="title" name="title" type="text" maxlength="60" placeholder="例如：宿舍台灯" data-i18n-placeholder="form.namePlaceholder" aria-describedby="title-error" required>
              <p class="field-error" id="title-error" hidden></p>
            </div>
            <div class="field field-description">
              <label for="description"><span data-i18n="form.description">描述</span><span data-i18n="form.required">必填</span></label>
              <textarea id="description" name="description" maxlength="300" placeholder="简单介绍物品的新旧程度、使用情况等" data-i18n-placeholder="form.descriptionPlaceholder" aria-describedby="description-error" required></textarea>
              <p class="field-error" id="description-error" hidden></p>
            </div>
            <div class="field-pair">
             <div class="field">
              <label for="price"><span data-i18n="form.price">价格（元）</span><span data-i18n="form.required">必填</span></label>
              <input id="price" name="price" type="number" min="0" step="0.01" placeholder="请输入价格" data-i18n-placeholder="form.pricePlaceholder" aria-describedby="price-error" required>
              <p class="field-error" id="price-error" hidden></p>
             </div>
             <div class="field">
              <label for="category"><span data-i18n="form.category">分类</span><span data-i18n="form.required">必填</span></label>
              <select id="category" name="category" aria-describedby="category-error" required>
                <option value="" selected disabled data-i18n="form.chooseCategory">请选择分类</option>
                <option value="书籍教材" data-i18n="category.books">书籍教材</option>
                <option value="数码配件" data-i18n="category.tech">数码配件</option>
                <option value="生活用品" data-i18n="category.home">生活用品</option>
                <option value="运动户外" data-i18n="category.sports">运动户外</option>
                <option value="其他好物" data-i18n="category.other">其他好物</option>
              </select>
              <p class="field-error" id="category-error" hidden></p>
             </div>
            </div>
            <div class="field">
              <label for="condition"><span data-i18n="form.condition">成色</span><span data-i18n="form.optional">选填</span></label>
              <select id="condition" name="condition">
                <option value="" selected data-i18n="form.chooseCondition">请选择成色（选填）</option>
                <option value="全新" data-i18n="condition.new">全新</option>
                <option value="九成新" data-i18n="condition.likeNew">九成新</option>
                <option value="八成新" data-i18n="condition.great">八成新</option>
                <option value="七成新" data-i18n="condition.good">七成新</option>
                <option value="有使用痕迹" data-i18n="condition.used">有使用痕迹</option>
              </select>
            </div>
            <div class="field field-photos">
              <label for="photos"><span data-i18n="form.photos">实拍照片</span><span data-i18n="form.photosHint">选填，可从本地选择多张</span></label>
              <input id="photos" name="photos" type="file" accept="image/*" multiple>
              <p class="field-error" id="photos-error" hidden></p>
            </div>
            <div class="photo-preview" id="photo-preview" aria-live="polite"></div>
            <p class="form-error" id="form-error" role="alert" hidden></p>
            <div class="form-actions">
              <button class="secondary-button" id="back-to-market" type="button" data-i18n="message.back">← 返回上一页</button>
              <button class="action-button" id="form-submit-button" type="submit" data-i18n="form.submit">预览发布</button>
            </div>
          </form>
        </div>
      </section>

      <section class="view" id="detail-view" aria-label="商品详情" data-i18n-aria-label="detail.aria" hidden>
        <div class="detail-topline">
          <button class="text-button" id="detail-back" type="button" data-i18n="detail.back">← 返回列表</button>
          <div class="detail-badges">
            <span class="category" id="detail-category"></span>
            <span class="listing-status" id="detail-status"></span>
          </div>
        </div>
        <div class="detail-layout">
          <div class="detail-gallery">
            <div class="detail-main-image" id="detail-main-image"></div>
            <div class="thumbnails" id="thumbnails" aria-label="商品图片缩略图" data-i18n-aria-label="detail.thumbnails"></div>
            <h2 class="detail-section-title" data-i18n="detail.description">商品介绍</h2>
            <p class="detail-description" id="detail-description"></p>
          </div>
          <div class="detail-copy">
            <h1 id="detail-title"></h1>
            <div class="detail-price-row">
              <p class="detail-price" id="detail-price"></p>
              <button class="like-button detail-like-button" id="detail-like-button" type="button">
                <span class="heart-icon" aria-hidden="true">♡</span>
                <span class="like-count" id="detail-like-count">0</span>
              </button>
            </div>
            <dl class="detail-facts">
              <div class="detail-fact">
                <dt data-i18n="form.condition">成色</dt>
                <dd id="detail-condition"></dd>
              </div>
              <div class="detail-fact">
                <dt data-i18n="detail.location">交收地点</dt>
                <dd id="detail-location"></dd>
              </div>
              <div class="detail-fact">
                <dt data-i18n="detail.seller">卖家昵称</dt>
                <dd id="detail-seller"></dd>
              </div>
              <div class="detail-fact">
                <dt data-i18n="detail.flaws">瑕疵</dt>
                <dd id="detail-flaws"></dd>
              </div>
            </dl>
            <button class="action-button contact-button" id="contact-seller" type="button" data-i18n="detail.contact">联系卖家</button>
          </div>
        </div>
      </section>

      <section class="view" id="messages-view" aria-label="消息" data-i18n-aria-label="message.title" hidden>
        <button class="text-button messages-back" id="messages-back" type="button" data-i18n="message.back">← 返回上一页</button>
        <h1 class="messages-heading" data-i18n="message.title">消息</h1>
        <div class="messages-layout">
          <aside class="conversation-panel" aria-label="会话列表" data-i18n-aria-label="message.conversations">
            <h1 data-i18n="message.conversations">会话</h1>
            <p class="conversation-hint" data-i18n="message.notice">演示对话只在当前页面显示，不会真实发送。</p>
            <div class="conversation-list" id="conversation-list"></div>
          </aside>
          <section class="thread-panel" id="chat-dialog" aria-label="演示会话" data-i18n-aria-label="message.demoChat">
            <div class="thread-empty" id="thread-empty" data-i18n="message.selectConversation">选择一个会话查看消息。</div>
            <div class="thread-content" id="thread-content" hidden>
              <header class="thread-product">
                <div class="thread-product-image" id="thread-product-image"></div>
                <div class="thread-product-copy">
                  <h2 class="thread-product-title" id="thread-product-title"></h2>
                  <span class="thread-product-price" id="thread-product-price"></span>
                  <span class="thread-seller" id="chat-seller"></span>
                </div>
              </header>
              <p class="chat-notice" data-i18n="message.notice">仅供界面演示：消息和报价只显示在当前页面，不会发送给真实卖家。</p>
              <div class="chat-messages" id="chat-messages" aria-live="polite"></div>
              <form class="chat-composer" id="chat-form">
                <label class="visually-hidden" for="chat-input" data-i18n="message.inputLabel">输入消息</label>
                <input id="chat-input" type="text" maxlength="240" placeholder="输入演示消息..." data-i18n-placeholder="message.inputPlaceholder" autocomplete="off" required>
                <button class="action-button" type="submit" data-i18n="message.send">发送</button>
              </form>
