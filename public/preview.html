    const supportedLanguages = Object.keys(translations);
    const storedLanguage = localStorage.getItem("campus-market-language");
    let currentLanguage = supportedLanguages.includes(storedLanguage) ? storedLanguage : "en";
    languageSelect.value = currentLanguage;

    function translate(key, values = {}) {
      const template = translations[currentLanguage][key] || translations["zh-CN"][key] || key;
      return template.replace(/\{(\w+)\}/g, (match, name) => values[name] ?? match);
    }

    function categoryTranslation(category) {
      const keys = {
        "书籍教材": "category.books",
        "数码配件": "category.tech",
        "生活用品": "category.home",
        "运动户外": "category.sports",
        "其他好物": "category.other"
      };
      return translate(keys[category] || "category.other");
    }

    function conditionTranslation(condition) {
      const keys = {
        "全新": "condition.new",
        "九成新": "condition.likeNew",
        "成色很新": "condition.likeNew",
        "八成新": "condition.great",
        "七成新": "condition.good",
        "有使用痕迹": "condition.used"
      };
      return condition ? translate(keys[condition] || "condition.unspecified") : translate("condition.unspecified");
    }

    function productText(product, field) {
      const localized = product.localized && product.localized[currentLanguage];
      return localized && localized[field] ? localized[field] : product[field];
    }

    function applyLanguage(language, persist = true) {
      if (!supportedLanguages.includes(language)) return;
      currentLanguage = language;
      languageSelect.value = language;
      document.documentElement.lang = language;
      document.title = translate("app.title");
      document.querySelectorAll("[data-i18n]").forEach((element) => {
        element.textContent = translate(element.dataset.i18n);
      });
      document.querySelectorAll("[data-i18n-placeholder]").forEach((element) => {
        element.placeholder = translate(element.dataset.i18nPlaceholder);
      });
      document.querySelectorAll("[data-i18n-aria-label]").forEach((element) => {
        element.setAttribute("aria-label", translate(element.dataset.i18nAriaLabel));
      });
      document.querySelectorAll("[data-i18n-alt]").forEach((element) => {
        element.alt = translate(element.dataset.i18nAlt);
      });

      document.querySelector("#home-button").setAttribute("aria-label", translate("nav.home"));
      document.querySelector("#open-inbox").setAttribute(
        "aria-label",
        translate(conversations.some((conversation) => conversation.unread) ? "nav.messagesUnread" : "nav.messages")
      );
      document.querySelector("#header-unread-dot").setAttribute("aria-label", translate("message.unread"));
      document.querySelector("#detail-category").textContent = selectedProduct
        ? categoryTranslation(selectedProduct.category)
        : "";
      document.querySelectorAll("#items .category").forEach((element) => {
        element.textContent = categoryTranslation(element.dataset.categoryValue);
      });
      document.querySelectorAll("#items .condition-label").forEach((element) => {
        element.textContent = conditionTranslation(element.dataset.conditionValue);
      });
      document.querySelectorAll("#items .image-placeholder").forEach((element) => {
        element.lastElementChild.textContent = translate("image.noPhoto");
      });
      document.querySelectorAll("#items .item-card").forEach((card) => {
        const product = products.find((entry) => entry.id === card.dataset.id);
        if (!product) return;
        const title = productText(product, "title");
        card.querySelector("h3").textContent = title;
        card.querySelector(".item-card-link").setAttribute("aria-label", translate("item.cardAria", {
          title,
          price: product.price,
          condition: conditionTranslation(product.condition)
        }));
        const image = card.querySelector(".item-cover img");
        if (image) image.alt = translate("detail.imageAlt", { title });
      });
      document.querySelectorAll(".thumbnail").forEach((thumbnail, index) => {
        thumbnail.setAttribute("aria-label", translate("detail.thumbnailAlt", { index: index + 1 }));
      });
      document.querySelectorAll("#photo-preview img").forEach((image, index) => {
        image.alt = translate("detail.thumbnailAlt", { index: index + 1 });
      });
      document.querySelector("#form-title").textContent = translate(editingProductId ? "form.editTitle" : "form.title");
      document.querySelector("#form-submit-button").textContent = translate(editingProductId ? "form.update" : "form.submit");
      document.querySelector("#back-to-market").textContent = translate("message.back");
      Object.entries(formErrors).forEach(([field, key]) => {
        const errorElement = document.querySelector(`#${field}-error`);
        if (errorElement) {
          errorElement.textContent = translate(key);
          errorElement.hidden = false;
        }
      });
      if (selectedProduct) {
        document.querySelector("#detail-title").textContent = productText(selectedProduct, "title");
        document.querySelector("#detail-description").textContent = productText(selectedProduct, "description");
        document.querySelector("#detail-condition").textContent = conditionTranslation(selectedProduct.condition);
        document.querySelector("#detail-location").textContent = productText(selectedProduct, "location");
        document.querySelector("#detail-flaws").textContent = productText(selectedProduct, "flaws") || translate("detail.notSpecified");
        document.querySelector("#detail-seller").textContent = productText(selectedProduct, "seller");
        const status = document.querySelector("#detail-status");
        status.textContent = translate(selectedProduct.status === "sold" ? "listing.statusSold" : "listing.statusActive");
        status.classList.toggle("sold", selectedProduct.status === "sold");
        if (selectedProduct.images.length === 0) {
          document.querySelector("#detail-main-image").replaceChildren(createPlaceholder(translate("image.noPhoto")));
        } else {
          const image = document.querySelector("#detail-main-image img");
          if (image) image.alt = translate("detail.imageAlt", { title: productText(selectedProduct, "title") });
        }
      }

      renderShowcase();
      document.querySelectorAll(".like-button").forEach((button) => {
        const product = products.find((entry) => entry.id === button.dataset.productId);
        if (product) updateLikeButton(button, product);
      });
      updateResults();
      renderChatMessages();
      updateUnreadIndicators();
      renderMyListings();
      renderThread();
      if (persist) localStorage.setItem("campus-market-language", language);
    }

    let products = [];

    const likedProductStorageKey = "campus-market-liked-products";
    const likedProductIds = new Set(
      (localStorage.getItem(likedProductStorageKey) || "")
        .split(",")
        .filter((id) => id && products.some((product) => product.id === id))
    );

    const conversations = [
      {
        id: "conversation-math-book",
        productId: "math-book",
        unread: true,
        messages: [{ key: "message.mockBook", mine: false, timestamp: Date.now() - 1500000 }]
      },
      {
        id: "conversation-wireless-earphones",
        productId: "wireless-earphones",
        unread: true,
        messages: [{ key: "message.mockEarphones", mine: false, timestamp: Date.now() - 360000 }]
      }
    ];

    let activeCategory = "";
    let selectedProduct = null;
    let selectedConversationId = null;
    let messageReturnTarget = null;
    let myListingsReturnTarget = null;
    let publishReturnTarget = null;
    let selectedImageIndex = 0;
    let currentView = "market";
    let detailReturnView = "market";
    let editingProductId = null;
    let pendingDeleteId = null;
    let selectedFiles = [];
    let photoPreviewUrls = [];
    let formErrors = {};
    const demoAccountId = "campus-demo-account";

    function createPlaceholder(label, { compact = false } = {}) {
      const placeholder = document.createElement("div");
      placeholder.className = "image-placeholder";
      if (compact) {
        placeholder.setAttribute("role", "img");
        placeholder.setAttribute("aria-label", label);
      }
      const icon = document.createElement("span");
      icon.className = "placeholder-icon";
      icon.setAttribute("aria-hidden", "true");
      icon.textContent = "▧";
      const text = document.createElement("span");
      text.textContent = label;
      text.hidden = compact;
      placeholder.append(icon, text);
      return placeholder;
    }

    function getLikeCount(product) {
      return likedProductIds.has(product.id) ? 1 : 0;
    }

    function updateLikeButton(button, product) {
      const liked = likedProductIds.has(product.id);
      const count = getLikeCount(product);
      button.dataset.productId = product.id;
      button.setAttribute("aria-pressed", String(liked));
      button.setAttribute("aria-label", translate(liked ? "like.remove" : "like.add", {
        title: productText(product, "title"),
        count
      }));
      button.querySelector(".heart-icon").textContent = liked ? "♥" : "♡";
      button.querySelector(".like-count").textContent = String(count);
    }

    function createLikeButton(product, extraClass = "") {
      const button = document.createElement("button");
      button.className = `like-button ${extraClass}`.trim();
      button.type = "button";
      const heart = document.createElement("span");
      heart.className = "heart-icon";
      heart.setAttribute("aria-hidden", "true");
      const count = document.createElement("span");
      count.className = "like-count";
      button.append(heart, count);
      updateLikeButton(button, product);
      return button;
    }

    function createProductCover(product, className) {
      const cover = document.createElement("div");
      cover.className = className;
      if (product.images.length > 0) {
        const image = document.createElement("img");
        image.src = product.images[0];
        image.alt = translate("detail.imageAlt", { title: productText(product, "title") });
        cover.append(image);
      } else {
        cover.append(createPlaceholder(translate("image.noPhoto")));
      }
      return cover;
    }

    function createCard(product) {
      const card = document.createElement("article");
      card.className = "item-card";
      card.dataset.id = product.id;
      card.dataset.category = product.category;
      card.dataset.search = [
        product.title,
        product.description,
        product.category,
        product.condition,
        product.location
      ].join(" ").toLocaleLowerCase();
      const link = document.createElement("a");
      link.className = "item-card-link";
      link.href = `#item-${encodeURIComponent(product.id)}`;
      link.setAttribute("aria-label", translate("item.cardAria", {
        title: productText(product, "title"),
        price: product.price,
        condition: conditionTranslation(product.condition)
      }));

      const cover = createProductCover(product, "item-cover");
      const content = document.createElement("div");
      content.className = "item-content";
      const category = document.createElement("span");
      category.className = "category";
      category.dataset.categoryValue = product.category;
      category.textContent = categoryTranslation(product.category);

      const title = document.createElement("h3");
      title.textContent = productText(product, "title");

      const bottom = document.createElement("div");
      bottom.className = "item-bottom";
      const price = document.createElement("span");
      price.className = "price";
      price.textContent = `¥${product.price}`;
      const condition = document.createElement("span");
      condition.className = "condition-label";
      condition.dataset.conditionValue = product.condition;
      condition.textContent = conditionTranslation(product.condition);

      bottom.append(price, condition);
      content.append(category, title, bottom);
      link.append(cover, content);
      card.append(link, createLikeButton(product));
      return card;
    }

    function createShowcaseCard(product) {
      const card = document.createElement("article");
      card.className = "showcase-tile showcase-product";
      card.dataset.id = product.id;
      const link = document.createElement("a");
      link.className = "showcase-link";
      link.href = `#item-${encodeURIComponent(product.id)}`;
      link.setAttribute("aria-label", translate("item.cardAria", {
        title: productText(product, "title"),
        price: product.price,
        condition: conditionTranslation(product.condition)
      }));
      const cover = createProductCover(product, "showcase-cover");
      const info = document.createElement("div");
      info.className = "showcase-info";
      const title = document.createElement("h3");
      title.className = "showcase-title";
      title.textContent = productText(product, "title");
      const price = document.createElement("span");
      price.className = "showcase-price";
      price.textContent = `¥${product.price}`;
      info.append(title, price);
      link.append(cover, info);
      card.append(link, createLikeButton(product));
      return card;
    }

    function createEmptyShowcaseTile() {
      const tile = document.createElement("div");
      tile.className = "showcase-tile showcase-empty";
      tile.textContent = translate("showcase.empty");
      return tile;
    }

    function renderShowcase() {
      const recommendations = products
        .filter((product) => product.status === "active")
        .sort((a, b) => getLikeCount(b) - getLikeCount(a) || b.createdAt - a.createdAt)
        .slice(0, 4)
        .map(createShowcaseCard);
      while (recommendations.length < 4) recommendations.push(createEmptyShowcaseTile());
      showcaseGrid.replaceChildren(...recommendations);
    }

    function toggleLike(productId) {
      const product = products.find((entry) => entry.id === productId);
      if (!product) return;
      if (likedProductIds.has(product.id)) likedProductIds.delete(product.id);
      else likedProductIds.add(product.id);
      localStorage.setItem(likedProductStorageKey, [...likedProductIds].join(","));
      renderShowcase();
      document.querySelectorAll(".like-button").forEach((button) => {
        const likedProduct = products.find((entry) => entry.id === button.dataset.productId);
        if (likedProduct) updateLikeButton(button, likedProduct);
      });
      if (selectedProduct && selectedProduct.id === product.id) {
        updateLikeButton(detailLikeButton, product);
      }
    }

    function renderProducts() {
      const latest = products
        .filter((product) => product.status === "active")
        .sort((a, b) => b.createdAt - a.createdAt);
      items.replaceChildren(...latest.map(createCard));
      renderShowcase();
      updateResults();
    }

    function updateResults() {
      const query = searchInput.value.trim().toLocaleLowerCase();
      const cards = [...items.querySelectorAll(".item-card")];
      let visibleCount = 0;

      cards.forEach((card) => {
        const product = products.find((entry) => entry.id === card.dataset.id);
        const searchableText = product
          ? [
              productText(product, "title"),
              productText(product, "description"),
              product.title,
              product.description,
              product.category,
              categoryTranslation(product.category),
              product.condition,
              conditionTranslation(product.condition),
              product.location
            ].join(" ").toLocaleLowerCase()
          : card.dataset.search;
        const matches = searchableText.includes(query)
          && (!activeCategory || card.dataset.category === activeCategory);
        card.hidden = !matches;
        if (matches) visibleCount += 1;
      });

      resultCount.textContent = translate("result.count", { count: visibleCount });
      emptyState.hidden = visibleCount !== 0;
    }

    function showMarket() {
      document.body.classList.add("home-page");
      currentView = "market";
      publishView.hidden = true;
      detailView.hidden = true;
      messagesView.hidden = true;
      myListingsView.hidden = true;
      marketView.hidden = false;
      updateResults();
    }

    function captureNavigationTarget() {
      if (currentView === "detail" && selectedProduct) {
        return { view: "detail", productId: selectedProduct.id, detailReturnView };
      }
      if (currentView === "my-listings") return { view: "my-listings", productId: null };
      if (currentView === "messages") return { view: "messages", productId: null };
      if (currentView === "publish") return { view: "publish", productId: null };
      return { view: "market", productId: null };
    }

    function restoreNavigationTarget(target) {
      if (target && target.view === "detail") {
        const product = products.find((entry) => entry.id === target.productId);
        if (product) {
          showDetail(product);
          detailReturnView = target.detailReturnView || "market";
          return;
        }
      }
      if (target && target.view === "my-listings") {
        showMyListings();
        return;
      }
      if (target && target.view === "messages") {
        showMessages();
        return;
      }
      if (target && target.view === "publish") {
        showPublish();
        return;
      }
      showMarket();
    }

    function openMyListings() {
      if (currentView !== "my-listings") myListingsReturnTarget = captureNavigationTarget();
      showMyListings();
    }

    function returnFromMyListings() {
      const target = myListingsReturnTarget;
      myListingsReturnTarget = null;
      restoreNavigationTarget(target);
    }

    function returnFromPublish() {
      const target = publishReturnTarget;
      publishReturnTarget = null;
      restoreNavigationTarget(target);
    }

    function showPublish() {
      document.body.classList.remove("home-page");
      currentView = "publish";
      marketView.hidden = true;
      detailView.hidden = true;
      messagesView.hidden = true;
      myListingsView.hidden = true;
      publishView.hidden = false;
      formError.hidden = true;
      document.querySelector("#title").focus();
    }

    function showMyListings() {
      document.body.classList.remove("home-page");
      currentView = "my-listings";
      marketView.hidden = true;
      publishView.hidden = true;
      detailView.hidden = true;
      messagesView.hidden = true;
      myListingsView.hidden = false;
      renderMyListings();
    }

    function showMessages() {
      document.body.classList.remove("home-page");
      currentView = "messages";
      marketView.hidden = true;
      publishView.hidden = true;
      detailView.hidden = true;
      myListingsView.hidden = true;
      messagesView.hidden = false;
      renderConversations();
      renderThread();
    }

    function startNewListing() {
      if (currentView !== "publish") publishReturnTarget = captureNavigationTarget();
      editingProductId = null;
      publishForm.reset();
      selectedFiles = [];
      formErrors = {};
      formError.hidden = true;
      clearPhotoPreview();
      clearFieldErrors();
      showPublish();
      applyLanguage(currentLanguage, false);
    }

    function setMainImage(index) {
      if (!selectedProduct || selectedProduct.images.length === 0) return;
      selectedImageIndex = index;
      const mainImage = document.querySelector("#detail-main-image");
      const image = document.createElement("img");
      image.src = selectedProduct.images[index];
      image.alt = translate("detail.imageAlt", { title: productText(selectedProduct, "title") });
      mainImage.replaceChildren(image);
      document.querySelectorAll(".thumbnail").forEach((thumbnail, thumbnailIndex) => {
        thumbnail.setAttribute("aria-pressed", String(thumbnailIndex === index));
      });
    }

    function renderGallery(product) {
      const mainImage = document.querySelector("#detail-main-image");
      const thumbnails = document.querySelector("#thumbnails");
      thumbnails.replaceChildren();
      selectedImageIndex = 0;

      if (product.images.length === 0) {
        mainImage.replaceChildren(createPlaceholder(translate("image.noPhoto")));
        thumbnails.hidden = true;
        return;
      }

      thumbnails.hidden = false;
      product.images.forEach((src, index) => {
        const thumbnail = document.createElement("button");
        thumbnail.className = "thumbnail";
        thumbnail.type = "button";
        thumbnail.setAttribute("aria-label", translate("detail.thumbnailAlt", { index: index + 1 }));
        thumbnail.setAttribute("aria-pressed", String(index === 0));
        const image = document.createElement("img");
        image.src = src;
        image.alt = "";
        thumbnail.append(image);
        thumbnail.addEventListener("click", () => setMainImage(index));
        thumbnails.append(thumbnail);
      });
      setMainImage(0);
    }

    function showDetail(product) {
      document.body.classList.remove("home-page");
      detailReturnView = currentView;
      selectedProduct = product;
      document.querySelector("#detail-category").textContent = categoryTranslation(product.category);
      const status = document.querySelector("#detail-status");
      status.textContent = translate(product.status === "sold" ? "listing.statusSold" : "listing.statusActive");
      status.classList.toggle("sold", product.status === "sold");
      document.querySelector("#detail-title").textContent = productText(product, "title");
      document.querySelector("#detail-price").textContent = `¥${product.price}`;
      updateLikeButton(detailLikeButton, product);
      document.querySelector("#detail-condition").textContent = conditionTranslation(product.condition);
      document.querySelector("#detail-location").textContent = productText(product, "location");
      document.querySelector("#detail-seller").textContent = productText(product, "seller");
      document.querySelector("#detail-flaws").textContent = productText(product, "flaws") || translate("detail.notSpecified");
      document.querySelector("#detail-description").textContent = productText(product, "description");
      renderGallery(product);
      marketView.hidden = true;
      publishView.hidden = true;
      messagesView.hidden = true;
      myListingsView.hidden = true;
      detailView.hidden = false;
      currentView = "detail";
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function returnFromDetail() {
      if (detailReturnView === "messages") showMessages();
      else if (detailReturnView === "my-listings") showMyListings();
      else showMarket();
    }

    function getSelectedConversation() {
      return conversations.find((conversation) => conversation.id === selectedConversationId) || null;
    }

    function getSelectedConversationProduct() {
      const conversation = getSelectedConversation();
      return conversation ? products.find((product) => product.id === conversation.productId) || null : null;
    }

    function renderChatMessages() {
      chatMessages.replaceChildren();
      const conversation = getSelectedConversation();
      if (!conversation) return;
      conversation.messages.forEach((message) => {
        const bubble = document.createElement("div");
        bubble.className = `chat-message${message.mine ? " mine" : ""}`;
        bubble.textContent = message.text || translate(message.key);
        chatMessages.append(bubble);
      });
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function renderThread() {
      const conversation = getSelectedConversation();
      const product = getSelectedConversationProduct();
      const hasConversation = Boolean(conversation && product);
      threadEmpty.hidden = hasConversation;
      threadContent.hidden = !hasConversation;
      if (!hasConversation) return;

      document.querySelector("#thread-product-title").textContent = productText(product, "title");
      document.querySelector("#thread-product-price").textContent = `¥${product.price}`;
      document.querySelector("#chat-seller").textContent = translate("message.withSeller", { seller: productText(product, "seller") });
      const imageContainer = document.querySelector("#thread-product-image");
      if (product.images.length) {
        const image = document.createElement("img");
        image.src = product.images[0];
        image.alt = translate("detail.imageAlt", { title: productText(product, "title") });
        imageContainer.replaceChildren(image);
      } else {
        imageContainer.replaceChildren(createPlaceholder(translate("image.noPhoto"), { compact: true }));
      }
      renderChatMessages();
    }

    function renderConversations() {
      conversationList.replaceChildren();
      conversations.forEach((conversation) => {
        const product = products.find((entry) => entry.id === conversation.productId);
        if (!product) return;

        const row = document.createElement("button");
        row.className = "conversation-row";
        row.type = "button";
        row.dataset.productId = product.id;
        row.dataset.conversationId = conversation.id;
        row.setAttribute("aria-current", String(selectedConversationId === conversation.id));

        const thumbnail = document.createElement("span");
        thumbnail.className = "conversation-thumb";
        if (product.images.length) {
          const image = document.createElement("img");
          image.src = product.images[0];
          image.alt = "";
          thumbnail.append(image);
        } else {
          thumbnail.append(createPlaceholder(translate("image.noPhoto")));
        }

        const content = document.createElement("span");
        content.className = "conversation-content";
        const title = document.createElement("span");
        title.className = "conversation-title";
        title.textContent = productText(product, "title");
        const seller = document.createElement("span");
        seller.className = "conversation-seller";
        seller.textContent = productText(product, "seller");
        const latestMessage = conversation.messages[conversation.messages.length - 1];
        const preview = document.createElement("span");
        preview.className = "conversation-preview";
        preview.textContent = latestMessage
          ? latestMessage.text || translate(latestMessage.key)
          : translate("message.noMessages");
        content.append(title, seller, preview);

        const side = document.createElement("span");
        side.className = "conversation-side";
        const time = document.createElement("span");
        time.className = "conversation-time";
        time.textContent = latestMessage && latestMessage.timestamp
          ? new Intl.DateTimeFormat(currentLanguage, { hour: "2-digit", minute: "2-digit" }).format(latestMessage.timestamp)
          : translate("message.timeNow");

        const unreadDot = document.createElement("span");
        unreadDot.className = "unread-dot";
        unreadDot.hidden = !conversation.unread;
        unreadDot.setAttribute("aria-label", translate("message.unread"));
        side.append(time, unreadDot);
        row.append(thumbnail, content, side);
        conversationList.append(row);
      });
    }

    function updateUnreadIndicators() {
      const hasUnread = conversations.some((conversation) => conversation.unread);
      document.querySelector("#header-unread-dot").hidden = !hasUnread;
      document.querySelector("#open-inbox").setAttribute(
        "aria-label",
        translate(hasUnread ? "nav.messagesUnread" : "nav.messages")
      );
      renderConversations();
      if (currentView === "messages") renderThread();
    }

    function ensureConversation(product) {
      let conversation = conversations.find((entry) => entry.productId === product.id);
      if (!conversation) {
        conversation = {
          id: `conversation-${product.id}`,
          productId: product.id,
          unread: false,
          messages: []
        };
        conversations.unshift(conversation);
      }
      return conversation;
    }

    function appendChatMessage(message, isMine) {
      const conversation = getSelectedConversation();
      if (!conversation) return;
      conversation.messages.push({ text: message, mine: isMine, timestamp: Date.now() });
      renderChatMessages();
      renderConversations();
    }

    function rememberMessageReturnTarget() {
      if (currentView === "detail" && selectedProduct) {
        messageReturnTarget = {
          view: "detail",
          productId: selectedProduct.id,
          detailReturnView
        };
      } else if (currentView === "my-listings") {
        messageReturnTarget = { view: "my-listings", productId: null };
      } else {
        messageReturnTarget = { view: "market", productId: null };
      }
    }

    function returnFromMessages() {
      const target = messageReturnTarget;
      messageReturnTarget = null;
      if (target && target.view === "detail") {
        const product = products.find((entry) => entry.id === target.productId);
        if (product) {
          showDetail(product);
          detailReturnView = target.detailReturnView || "market";
          return;
        }
      }
      if (target && target.view === "my-listings") {
        showMyListings();
        return;
      }
      showMarket();
    }

    function openInbox() {
      if (currentView !== "messages") rememberMessageReturnTarget();
      showMessages();
    }

    function openConversation(conversationId) {
      const conversation = conversations.find((entry) => entry.id === conversationId);
      if (!conversation) return;
      const product = products.find((entry) => entry.id === conversation.productId);
      if (!product) return;
      if (currentView !== "messages") rememberMessageReturnTarget();
      selectedProduct = product;
      selectedConversationId = conversationId;
      conversation.unread = false;
      updateUnreadIndicators();
      showMessages();
      document.querySelector("#chat-input").focus();
    }

    function openChat() {
      if (!selectedProduct) return;
      const conversation = ensureConversation(selectedProduct);
      openConversation(conversation.id);
    }

    function readImage(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.addEventListener("load", () => {
          if (typeof reader.result === "string") resolve(reader.result);
          else reject(new Error("图片读取失败，请重试。"));
        });
        reader.addEventListener("error", () => reject(new Error("无法读取所选图片，请重试。")));
        reader.readAsDataURL(file);
      });
    }

    function clearPhotoPreview() {
      photoPreviewUrls.forEach((url) => URL.revokeObjectURL(url));
      photoPreviewUrls = [];
      photoPreview.replaceChildren();
    }

    function renderPhotoPreview(sources) {
      clearPhotoPreview();
      sources.forEach((source, index) => {
        const image = document.createElement("img");
        image.src = source;
        image.alt = translate("detail.thumbnailAlt", { index: index + 1 });
        photoPreview.append(image);
      });
    }

    function setFieldError(field, key) {
      formErrors[field] = key;
      const errorElement = document.querySelector(`#${field}-error`);
      errorElement.textContent = translate(key);
      errorElement.hidden = false;
    }

    function clearFieldError(field) {
      delete formErrors[field];
      const errorElement = document.querySelector(`#${field}-error`);
      errorElement.textContent = "";
      errorElement.hidden = true;
    }

    function clearFieldErrors() {
      formErrors = {};
      document.querySelectorAll(".field-error").forEach((element) => {
        element.textContent = "";
        element.hidden = true;
      });
    }

    function validateListing() {
      clearFieldErrors();
      const title = document.querySelector("#title").value.trim();
      const description = document.querySelector("#description").value.trim();
      const priceValue = document.querySelector("#price").value;
      const price = Number(priceValue);
      const category = document.querySelector("#category").value;
      let firstInvalid = null;

      const check = (field, invalid, key) => {
        if (!invalid) return;
        setFieldError(field, key);
        if (!firstInvalid) firstInvalid = document.querySelector(`#${field}`);
      };
      check("title", !title, "form.errorTitle");
      check("description", !description, "form.errorDescription");
      check("price", priceValue === "" || !Number.isFinite(price) || price < 0, "form.errorPrice");
      check("category", !category, "form.errorCategory");
      if (firstInvalid) firstInvalid.focus();
      return !firstInvalid;
    }

    function renderMyListings() {
      myListingsList.replaceChildren();
         const ownListings = products.filter((product) => product.seller === "test user" || product.seller === "zhangsan" || product.seller === "lisi" || product.seller === "wangwu");
      if (!ownListings.length) {
        const empty = document.createElement("div");
        empty.className = "empty-listings";
        empty.textContent = translate("listing.empty");
        myListingsList.append(empty);
        return;
      }

      ownListings.forEach((product) => {
        const row = document.createElement("article");
        row.className = "my-listing";
        row.dataset.id = product.id;

        const cover = document.createElement("div");
        cover.className = "my-listing-cover";
        if (product.images.length) {
          const image = document.createElement("img");
          image.src = product.images[0];
          image.alt = translate("detail.imageAlt", { title: productText(product, "title") });
          cover.append(image);
        } else {
          cover.append(createPlaceholder(translate("image.noPhoto")));
        }

        const info = document.createElement("div");
        info.className = "my-listing-info";
        const title = document.createElement("button");
        title.className = "my-listing-title";
        title.type = "button";
        title.dataset.action = "view";
        title.textContent = productText(product, "title");
        const meta = document.createElement("div");
        meta.className = "my-listing-meta";
        const price = document.createElement("span");
        price.className = "my-listing-price";
        price.textContent = `¥${product.price}`;
        const status = document.createElement("span");
        status.className = `listing-status${product.status === "sold" ? " sold" : ""}`;
        status.textContent = translate(product.status === "sold" ? "listing.statusSold" : "listing.statusActive");
        meta.append(price, status);
        info.append(title, meta);

        const actions = document.createElement("div");
        actions.className = "listing-actions";
        [
          ["edit", "listing.edit"],
          [product.status === "sold" ? "relist" : "sold", product.status === "sold" ? "listing.relist" : "listing.markSold"],
          ["delete", "listing.delete"]
        ].forEach(([action, key]) => {
          const button = document.createElement("button");
          button.type = "button";
          button.dataset.action = action;
          button.textContent = translate(key);
          actions.append(button);
        });
        row.append(cover, info, actions);

        if (pendingDeleteId === product.id) {
          const confirmation = document.createElement("div");
          confirmation.className = "delete-confirm";
          const prompt = document.createElement("span");
          prompt.textContent = translate("listing.confirmPrompt");
          const confirm = document.createElement("button");
          confirm.type = "button";
          confirm.dataset.action = "confirm-delete";
          confirm.textContent = translate("listing.confirmDelete");
          const cancel = document.createElement("button");
          cancel.type = "button";
          cancel.dataset.action = "cancel-delete";
          cancel.textContent = translate("listing.cancelDelete");
          confirmation.append(prompt, confirm, cancel);
          row.append(confirmation);
        }
        myListingsList.append(row);
      });
    }

    function startEditing(product) {
      publishReturnTarget = { view: "my-listings", productId: null };
      editingProductId = product.id;
      publishForm.reset();
      clearFieldErrors();
      formError.hidden = true;
      selectedFiles = [];
      clearPhotoPreview();
      document.querySelector("#title").value = productText(product, "title");
      document.querySelector("#description").value = productText(product, "description");
      document.querySelector("#price").value = product.price;
      document.querySelector("#category").value = product.category;
      document.querySelector("#condition").value = product.condition || "";
      renderPhotoPreview(product.images);
      showPublish();
      applyLanguage(currentLanguage, false);
    }

    function localizedUserFields(title, description) {
      return {
        "zh-CN": { title, description, location: "校内约地点", seller: "校园集同学" },
        "zh-TW": { title, description, location: "校內約地點", seller: "校園集同學" },
        en: { title, description, location: "Campus meet-up point", seller: "Campus Market member" }
      };
    }

    async function removeListing(productId) {
      try {
        const response = await fetch(`/api/items/${productId}`, {
          method: 'DELETE'
        });

        if (response.ok) {
          alert("刪除成功！");
          // refresh the product list and my listings after deletion
          await loadBackendData();
          pendingDeleteId = null;
          renderMyListings();
          showMarket(); // back to market view after deletion
        } else {
          alert("刪除失敗。");
        }
      } catch (error) {
        console.error("刪除失敗:", error);
      }
    }

    searchInput.addEventListener("input", updateResults);
    searchForm.addEventListener("submit", (event) => {
      event.preventDefault();
      updateResults();
    });
    document.querySelector(".popular-search-list").addEventListener("click", (event) => {
      const button = event.target.closest(".popular-search");
      if (!button) return;
      searchInput.value = button.textContent.trim();
      searchInput.dispatchEvent(new Event("input", { bubbles: true }));
    });
    languageSelect.addEventListener("change", () => {
      applyLanguage(languageSelect.value);
    });
    categoryFilters.addEventListener("click", (event) => {
      const chip = event.target.closest(".category-chip");
      if (!chip) return;
      activeCategory = chip.dataset.category;
      categoryFilters.querySelectorAll(".category-chip").forEach((button) => {
        button.setAttribute("aria-pressed", String(button === chip));
      });
      updateResults();
    });

    function handleProductGridClick(event) {
      const likeButton = event.target.closest(".like-button");
      if (likeButton && event.currentTarget.contains(likeButton)) {
        toggleLike(likeButton.dataset.productId);
        return;
      }
      const link = event.target.closest(".item-card-link, .showcase-link");
      if (!link || !event.currentTarget.contains(link)) return;
      event.preventDefault();
      const card = link.closest(".item-card, .showcase-product");
      const product = card && products.find((entry) => entry.id === card.dataset.id);
      if (product) showDetail(product);
    }

    items.addEventListener("click", handleProductGridClick);
    showcaseGrid.addEventListener("click", handleProductGridClick);

    document.querySelector("#home-button").addEventListener("click", showMarket);
    document.querySelector("#open-marketplace").addEventListener("click", showMarket);
    document.querySelector("#back-to-market").addEventListener("click", returnFromPublish);
    document.querySelector("#publish-back").addEventListener("click", returnFromPublish);
    document.querySelector("#my-listings-back").addEventListener("click", returnFromMyListings);
    document.querySelector("#detail-back").addEventListener("click", returnFromDetail);
    document.querySelector("#messages-back").addEventListener("click", returnFromMessages);
    document.querySelector("#open-publish").addEventListener("click", startNewListing);
    document.querySelector("#open-my-listings").addEventListener("click", openMyListings);
    document.querySelector("#open-inbox").addEventListener("click", openInbox);
    document.querySelector("#contact-seller").addEventListener("click", openChat);
    detailLikeButton.addEventListener("click", () => {
      if (selectedProduct) toggleLike(selectedProduct.id);
    });
    conversationList.addEventListener("click", (event) => {
      const row = event.target.closest(".conversation-row");
      if (!row) return;
      openConversation(row.dataset.conversationId);
    });
    myListingsList.addEventListener("click", (event) => {
      const button = event.target.closest("[data-action]");
      if (!button) return;
      const row = button.closest(".my-listing");
      const product = row && products.find((entry) => entry.id === row.dataset.id);
      if (!product) return;

      switch (button.dataset.action) {
        case "view":
          showDetail(product);
          break;
        case "edit":
          startEditing(product);
          break;
        case "sold":
          product.status = "sold";
          renderProducts();
          renderMyListings();
          break;
        case "relist":
          product.status = "active";
          renderProducts();
          renderMyListings();
          break;
        case "delete":
          pendingDeleteId = product.id;
          renderMyListings();
          break;
        case "confirm-delete":
          removeListing(product.id);
          break;
        case "cancel-delete":
          pendingDeleteId = null;
          renderMyListings();
          break;
      }
    });

    document.querySelector("#chat-form").addEventListener("submit", (event) => {
      event.preventDefault();
      const input = document.querySelector("#chat-input");
      const message = input.value.trim();
      if (!message) return;
      appendChatMessage(message, true);
      input.value = "";
      input.focus();
    });

    document.querySelector("#offer-form").addEventListener("submit", (event) => {
      event.preventDefault();
      const input = document.querySelector("#offer-price");
      const product = getSelectedConversationProduct();
      if (!input.reportValidity() || !product) return;
      appendChatMessage(translate("message.offerText", {
        price: input.value,
        title: productText(product, "title")
      }), true);
      input.value = "";
    });

    publishForm.querySelectorAll("input, textarea, select").forEach((input) => {
      input.addEventListener("input", () => {
        if (input.id && formErrors[input.id]) clearFieldError(input.id);
      });
      input.addEventListener("change", () => {
        if (input.id && formErrors[input.id]) clearFieldError(input.id);
      });
    });

    photoInput.addEventListener("change", () => {
      selectedFiles = [...photoInput.files];
      clearFieldError("photos");
      clearPhotoPreview();
      photoPreviewUrls = selectedFiles.map((file) => URL.createObjectURL(file));
      photoPreviewUrls.forEach((url, index) => {
        const image = document.createElement("img");
        image.src = url;
        image.alt = translate("detail.thumbnailAlt", { index: index + 1 });
        photoPreview.append(image);
      });
    });

    publishForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      if (!validateListing()) return;
      
      formError.hidden = true;
      const title = document.querySelector("#title").value.trim();
      const description = document.querySelector("#description").value.trim();
      const price = String(document.querySelector("#price").value);
      const category = document.querySelector("#category").value;
      const condition = document.querySelector("#condition").value;

      // change the data structure to match the backend API requirements
      const newItemData = {
        title: title,
        description: description,
        price: Number(price),
        category: category,
        condition: condition,
        seller: "test user" // backend will handle the actual user authentication and association
      };

      try {
        // send the new item data to the backend API
        const response = await fetch('/api/items', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(newItemData)
        });

        if (response.ok) {
          alert("Published successfully! Saved to the database!");
          
          // refresh the product list and my listings after publishing
          await loadBackendData();
          
          // clear the form and reset the view to market after successful publishing
          publishForm.reset();
          clearFieldErrors();
          searchInput.value = "";
          activeCategory = "";
          categoryFilters.querySelectorAll(".category-chip").forEach((button, index) => {
            button.setAttribute("aria-pressed", String(index === 0));
          });
          showMarket();
        } else {
          alert("Failed to publish, please check the fields.");
        }
      } catch (error) {
        console.error("Failed to publish:", error);
        alert("System error, unable to connect to server.");
      }
    });

    // retrieve data from backend API and transform it to frontend format
      async function loadBackendData() {
        try {
          const response = await fetch('/api/items');
          const data = await response.json();

          // transform backend data to frontend format
          products = data.map(item => ({
            id: item._id,
            createdAt: new Date(item.createdAt).getTime() || Date.now(),
            title: item.title,
            description: item.description,
            price: String(item.price),
            category: item.category,
            condition: item.condition || "unknown",
            status: item.status === 'Available' ? 'active' : 'sold',
            location: "school campus",
            seller: item.seller ? item.seller.username : "unknown",
            flaws: "",
            images: []
          }));

          document.body.classList.add("home-page");
          renderProducts();
          updateUnreadIndicators();
          applyLanguage(currentLanguage, false);

        } catch (error) {
          console.error("Failed to load products:", error);
          alert("System error, unable to connect to server.");
        }
      }

    // initial load of backend data
    loadBackendData();
  </script>
</body>
</html>
